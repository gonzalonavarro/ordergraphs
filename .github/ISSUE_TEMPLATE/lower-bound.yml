name: Lower-bound claim
description: Report a lower bound on the size of complete order graphs, with a proof or reference.
title: "Lower-bound claim: "
labels: ["lower-bound"]
body:
  - type: markdown
    attributes:
      value: |
        Lower bounds cannot be checked automatically. Once the maintainer approves the submission,
        it is listed on the page as an **unverified claim**, until it is accepted. A bot only checks
        that the claim is well formed and does not exceed the size of a verified graph.
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - Bidirectional
        - Unidirectional
        - Both
    validations:
      required: true
  - type: textarea
    id: bounds
    attributes:
      label: Bounds
      description: One line per dimension, as `d value`, meaning that every complete order graph of dimension d has at least `value` edges (e.g. `7 72`).
      render: text
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Statement
      description: The general result, if any (e.g. a formula valid for all d), in words or LaTeX.
  - type: input
    id: contributors
    attributes:
      label: Contributors
      description: Names to be shown on the page.
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference
      description: Where the proof can be found (authors, title, venue, year), or a short description.
  - type: input
    id: url
    attributes:
      label: Link
      description: URL of the proof, preprint, or publication. Give at least a reference or a link.
  - type: textarea
    id: comment
    attributes:
      label: Comment
      description: Anything you would like to add (optional).
