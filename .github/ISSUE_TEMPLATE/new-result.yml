name: New result
description: Submit a complete order graph that matches or improves a best known size.
title: "New result: "
labels: ["new-result"]
body:
  - type: markdown
    attributes:
      value: |
        The graph is checked automatically after you submit; a bot will comment with the result.
        Once the maintainer approves it, it is added to the page.
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - Bidirectional
        - Unidirectional
    validations:
      required: true
  - type: input
    id: d
    attributes:
      label: Dimension d
      placeholder: "7"
    validations:
      required: true
  - type: textarea
    id: graph
    attributes:
      label: Graph
      description: |
        Either an edge list, one edge per line as `order label` (e.g. `412563 6`; for d ≥ 10 write
        the order with commas), or the compact format, one component per line as `start: code`
        (e.g. `412563: 3[6[5]]6*`). See the page for details.
      render: text
    validations:
      required: true
  - type: input
    id: contributors
    attributes:
      label: Contributors
      description: Names to be shown on the page.
    validations:
      required: true
  - type: input
    id: method
    attributes:
      label: Method
      description: How the graph was found (one line).
  - type: input
    id: reference
    attributes:
      label: Reference
      description: Publication or preprint, if any (authors, title, venue, year).
  - type: input
    id: url
    attributes:
      label: Link
      description: URL of the publication, preprint, or code (optional).
  - type: textarea
    id: comment
    attributes:
      label: Comment
      description: Anything you would like to add (optional).
